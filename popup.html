<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alparslan</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 340px;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f8fafc;
        overflow: hidden;
        box-sizing: border-box;
      }
      * {
        box-sizing: border-box;
      }
      .hidden {
        display: none !important;
      }
      #root {
        width: 340px;
      }
      .intro-card {
        width: 100%;
        min-height: 285px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
        border: 1px solid rgba(226, 232, 240, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px 18px;
        box-sizing: border-box;
        position: relative;
        z-index: 1;
        overflow: hidden;
      }
      .intro-card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.72;
        background:
          linear-gradient(
            137deg,
            transparent 0 31%,
            rgba(30, 64, 175, 0.1) 31.2%,
            rgba(30, 64, 175, 0.1) 31.7%,
            transparent 32%
          ),
          linear-gradient(
            42deg,
            transparent 0 44%,
            rgba(34, 197, 94, 0.08) 44.2%,
            rgba(34, 197, 94, 0.08) 44.8%,
            transparent 45.2%
          ),
          linear-gradient(
            104deg,
            transparent 0 60%,
            rgba(30, 64, 175, 0.08) 60.2%,
            rgba(30, 64, 175, 0.08) 60.8%,
            transparent 61.2%
          ),
          linear-gradient(
            22deg,
            transparent 0 72%,
            rgba(34, 197, 94, 0.07) 72.2%,
            rgba(34, 197, 94, 0.07) 72.8%,
            transparent 73.2%
          ),
          radial-gradient(
            circle at 29% 28%,
            rgba(30, 64, 175, 0.42) 0 2px,
            transparent 3px
          ),
          radial-gradient(
            circle at 68% 31%,
            rgba(34, 197, 94, 0.4) 0 2px,
            transparent 3px
          ),
          radial-gradient(
            circle at 23% 66%,
            rgba(34, 197, 94, 0.34) 0 2px,
            transparent 3px
          ),
          radial-gradient(
            circle at 75% 72%,
            rgba(30, 64, 175, 0.34) 0 2px,
            transparent 3px
          );
      }
      .intro-card::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.48;
        background:
          radial-gradient(
            circle at 50% 42%,
            rgba(30, 64, 175, 0.1),
            transparent 92px
          ),
          radial-gradient(
            circle at 68% 31%,
            rgba(34, 197, 94, 0.12),
            transparent 38px
          ),
          radial-gradient(
            circle at 29% 28%,
            rgba(59, 130, 246, 0.1),
            transparent 38px
          ),
          radial-gradient(
            circle at 75% 72%,
            rgba(30, 64, 175, 0.08),
            transparent 42px
          );
      }
      .intro-title {
        font-size: 12px;
        line-height: 1.35;
        font-weight: 700;
        color: #172554;
        text-align: center;
        max-width: 280px;
        position: relative;
        z-index: 1;
      }
      .intro-subtitle {
        font-size: 12px;
        color: #64748b;
        text-align: center;
        margin-top: -8px;
        max-width: 250px;
      }

      .intro-activate-btn {
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        font-family: inherit;
        position: relative;
        z-index: 1;
      }
      .intro-logo {
        width: 82px;
        height: 82px;
        object-fit: contain;
        filter: grayscale(1) brightness(0.7)
          drop-shadow(0 6px 10px rgba(15, 23, 42, 0.1));
        transition:
          filter 0.35s ease,
          transform 0.35s ease;
      }
      .intro-logo.awake {
        filter: grayscale(0) brightness(1)
          drop-shadow(0 0 10px rgba(34, 197, 94, 0.35))
          drop-shadow(0 0 22px rgba(34, 197, 94, 0.28));
        animation: introGlowBurst 0.55s ease;
      }
      @keyframes introGlowBurst {
        0% {
          transform: scale(1);
          filter: grayscale(1) brightness(0.7)
            drop-shadow(0 6px 10px rgba(15, 23, 42, 0.1));
        }
        45% {
          transform: scale(1.08);
          filter: grayscale(0) brightness(1.06)
            drop-shadow(0 0 18px rgba(34, 197, 94, 0.45))
            drop-shadow(0 0 34px rgba(34, 197, 94, 0.32));
        }
        100% {
          transform: scale(1);
          filter: grayscale(0) brightness(1)
            drop-shadow(0 0 10px rgba(34, 197, 94, 0.35))
            drop-shadow(0 0 22px rgba(34, 197, 94, 0.28));
        }
      }
      .intro-switch {
        width: 168px;
        height: 52px;
        border-radius: 999px;
        background: linear-gradient(135deg, #111827, #374151);
        position: relative;
        box-shadow:
          inset 0 0 0 2px rgba(255, 255, 255, 0.85),
          0 8px 18px rgba(15, 23, 42, 0.16);
        box-sizing: border-box;
        transition:
          background 0.35s ease,
          box-shadow 0.35s ease,
          transform 0.18s ease,
          filter 0.18s ease;
      }
      .intro-switch-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #ffffff;
        color: #111827;
        font-size: 12px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 5px 14px rgba(15, 23, 42, 0.2);
        position: absolute;
        top: 6px;
        left: 6px;
        transition:
          left 0.35s ease,
          color 0.35s ease,
          transform 0.2s ease;
      }
      .intro-switch.active {
        background: linear-gradient(135deg, #16a34a, #22c55e);
        box-shadow:
          inset 0 0 0 2px rgba(255, 255, 255, 0.92),
          0 12px 26px rgba(34, 197, 94, 0.3);
      }

      .intro-switch.active .intro-switch-circle {
        left: 122px;
        color: #15803d;
      }

      .intro-activate-btn:hover .intro-switch {
        transform: translateY(-1px) scale(1.015);
        filter: brightness(1.03);
      }

      .intro-activate-btn:hover .intro-switch-circle {
        transform: scale(1.04);
      }
      .intro-activate-btn:hover .intro-switch-circle {
        transform: scale(1.04);
      }

      .intro-activate-btn:active .intro-switch {
        transform: scale(0.98);
      }
      .intro-screen {
        width: 340px;
        min-height: 470px;
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 0;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(
            circle at top,
            rgba(34, 197, 94, 0.08),
            transparent 42%
          ),
          linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      }
      .intro-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.06;
        background:
          repeating-linear-gradient(
            125deg,
            rgba(30, 64, 175, 0.35) 0px,
            rgba(30, 64, 175, 0.35) 1px,
            transparent 1px,
            transparent 34px
          ),
          repeating-linear-gradient(
            55deg,
            rgba(34, 197, 94, 0.22) 0px,
            rgba(34, 197, 94, 0.22) 1px,
            transparent 1px,
            transparent 46px
          ),
          radial-gradient(
            circle at 18% 24%,
            rgba(30, 64, 175, 0.5) 0 2px,
            transparent 3px
          ),
          radial-gradient(
            circle at 74% 18%,
            rgba(34, 197, 94, 0.45) 0 2px,
            transparent 3px
          ),
          radial-gradient(
            circle at 82% 48%,
            rgba(30, 64, 175, 0.38) 0 2px,
            transparent 3px
          ),
          radial-gradient(
            circle at 28% 68%,
            rgba(34, 197, 94, 0.4) 0 2px,
            transparent 3px
          ),
          radial-gradient(
            circle at 66% 78%,
            rgba(30, 64, 175, 0.35) 0 2px,
            transparent 3px
          );
      }
      .intro-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.08;
        background:
          radial-gradient(
            circle at 22% 26%,
            rgba(34, 197, 94, 0.14),
            transparent 44px
          ),
          radial-gradient(
            circle at 76% 20%,
            rgba(59, 130, 246, 0.12),
            transparent 54px
          ),
          radial-gradient(
            circle at 68% 76%,
            rgba(34, 197, 94, 0.12),
            transparent 58px
          );
      }
      .intro-button-hint {
        font-size: 12px;
        color: #64748b;
        text-align: center;
        margin-top: -2px;
        position: relative;
        z-index: 1;
      }
      .intro-switch-status {
        min-height: 18px;
        font-size: 12px;
        font-weight: 700;
        color: #16a34a;
        opacity: 0;
        transform: translateY(-4px);
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        text-align: center;
      }

      .intro-switch-status.active {
        opacity: 1;
        transform: translateY(0);
      }
      .intro-trust-footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        opacity: 1;
        pointer-events: none;
        z-index: 1;
      }
      .intro-trust-logos {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .intro-trust-logo {
        height: 18px;
        max-width: 70px;
        object-fit: contain;
        filter: none;
        opacity: 1;
      }
      .intro-trust-text {
        font-size: 10px;
        color: #64748b;
        font-weight: 600;
        letter-spacing: 0.1px;
      }
      .intro_logo {
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
    <script type="module" src="/src/popup/main.tsx"></script>
  </head>
  <body>
    <div id="introScreen" class="intro-screen hidden">
      <div class="intro-card">
        <div class="intro-title">
          Alparslan, internette gezinirken sizi dolandırıcılara ve tuzak
          sitelere karşı koruyan ücretsiz bir tarayıcı eklentisidir.
        </div>

        <button id="introActivateBtn" class="intro-activate-btn">
          <img
            id="introLogo"
            src="/icons/alparslan_logo.svg"
            alt="Alparslan Logo"
            class="intro-logo"
          />

          <div class="intro-switch" id="introSwitch">
            <div class="intro-switch-circle" id="introSwitchCircle"></div>
          </div>

          <div class="intro-button-hint">Koruma sistemini başlat</div>
        </button>
        <div id="introSwitchStatus" class="intro-switch-status">
          Kalkan Devrede
        </div>
      </div>

      <div class="intro-trust-footer">
        <div class="intro-trust-logos" , id="intro_logo">
          <img src="/icons/usom.png" alt="USOM" class="intro-trust-logo" />
        </div>
        <div class="intro-trust-text">
          Ulusal Siber Olaylara Müdahale Merkezinin <br />
          yayınladığı zararlı bağlantılar listesini kullanır.
        </div>
      </div>
    </div>

    <!-- #root starts VISIBLE so the React popup paints instantly for the
         99 % of users who already activated Alparslan. The intro overlay
         only steals the screen if intro-screen.ts decides activation is
         needed, eliminating the blank/intro flash users were seeing. -->
    <div id="root"></div>
  </body>
</html>
