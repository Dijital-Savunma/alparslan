<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beyaz Liste - Alparslan</title>

    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      .page {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .logo {
        width: 42px;
        height: 42px;
        object-fit: contain;
      }

      .title {
        font-size: 24px;
        font-weight: 800;
        color: #172554;
      }

      .subtitle {
        font-size: 14px;
        color: #64748b;
        margin-top: 4px;
      }

      .card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
        padding: 20px;
      }

      .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }

      .input-row input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #93c5fd;
        font-size: 14px;
        outline: none;
        background: #eff6ff;
      }

      .input-row input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      .add-btn {
        border: none;
        background: #1e3a8a;
        color: white;
        border-radius: 12px;
        padding: 0 18px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.15s ease;
      }

      .add-btn:hover:not(:disabled) {
        background: #1e40af;
        transform: translateY(-1px);
      }

      /* Input bos iken sonuk + cursor not-allowed. popup
         SettingsTab'taki Ekle butonuyla davranis paritesi. */
      .add-btn:disabled {
        background: #cbd5e1;
        color: #64748b;
        cursor: not-allowed;
        opacity: 0.7;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .empty {
        padding: 18px;
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
        background: #f8fafc;
        border-radius: 12px;
        border: 1px dashed #cbd5e1;
      }

      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
      }

      .domain {
        font-size: 14px;
        font-weight: 600;
        color: #334155;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .remove-btn {
        border: 1px solid #fecaca;
        background: #fee2e2;
        color: #dc2626;
        border-radius: 10px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.15s ease;
        flex-shrink: 0;
      }

      .remove-btn:hover {
        background: #fecaca;
      }

      .back-btn {
        margin-top: 16px;
        border: 1px solid #cbd5e1;
        background: #f1f5f9;
        color: #334155;
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .back-btn:hover {
        background: #e2e8f0;
      }
      .search-row {
        margin-bottom: 18px;
      }

      .search-row input {
        width: 100%;
        box-sizing: border-box;
        padding: 11px 14px;
        border-radius: 12px;
        border: 1px solid #d1d5db;
        font-size: 14px;
        outline: none;
        background: #f3f4f6;
      }

      .search-row input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        background: #ffffff;
      }

      /* Pagination — modern, sade prev/next butonlari + sayfa rozeti.
         Liste cok uzun olunca DOM'u 10 satirla sinirlamak icin. Tek
         sayfaysa CSS ile hide ediliyor (display: none yerine JS
         visibility manage ediyor cunku layout shift olmasin). */
      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #e2e8f0;
      }

      .pagination-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #cbd5e1;
        background: white;
        color: #334155;
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
        font-family: inherit;
        line-height: 1;
      }

      .pagination-btn:hover:not(:disabled) {
        background: #f1f5f9;
        border-color: #94a3b8;
        transform: translateY(-1px);
        box-shadow: 0 3px 8px rgba(15, 23, 42, 0.08);
      }

      .pagination-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .pagination-info {
        font-size: 13px;
        font-weight: 700;
        color: #475569;
        min-width: 84px;
        text-align: center;
        background: #f1f5f9;
        border-radius: 999px;
        padding: 6px 14px;
        letter-spacing: 0.2px;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <div class="header">
        <img src="/icons/alparslan_logo.svg" alt="Alparslan" class="logo" />

        <div>
          <div class="title">Alparslan - Beyaz Liste</div>
          <div class="subtitle">
            Bu listedeki siteler sadece sizde güvenli kabul edilir.
          </div>
        </div>
      </div>

      <div class="input-row">
        <input
          id="whitelistInput"
          type="text"
          placeholder="İstisna tutulacak web adresini girin..."
        />
        <button id="addBtn" class="add-btn">Ekle</button>
      </div>

      <div class="search-row">
        <input
          id="searchInput"
          type="text"
          placeholder="Beyaz listede ara..."
        />
      </div>

      <div id="whitelistList" class="list"></div>

      <div id="pagination" class="pagination" style="display: none">
        <button id="prevBtn" class="pagination-btn" type="button">
          <span>←</span>
          <span>Önceki</span>
        </button>
        <span id="pageInfo" class="pagination-info">1 / 1</span>
        <button id="nextBtn" class="pagination-btn" type="button">
          <span>Sonraki</span>
          <span>→</span>
        </button>
      </div>

      <button id="backBtn" class="back-btn">← Geri dön</button>
    </div>

    <script src="/whitelist.js"></script>
  </body>
</html>
